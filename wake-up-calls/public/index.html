<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wake-up Calls — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="loginForm">
    <h1>Wake<span style="color:var(--dawn)">·</span>Up Calls</h1>
    <p class="hint">College admin sign-in</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />
    <div style="height:12px"></div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <p class="error-text" id="loginError"></p>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>

<script type="module">
  import { login, auth } from "./js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace("dashboard.html");
  });

  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("loginError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    try {
      await login(document.getElementById("email").value.trim(), document.getElementById("password").value);
      window.location.replace("dashboard.html");
    } catch (err) {
      errorEl.textContent = "Sign-in failed — check email and password.";
    }
  });
</script>
</body>
</html>
